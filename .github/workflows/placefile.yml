name: Build mesonet placefile

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: placefile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild every 5 minutes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 55*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            if python3 build_placefile.py --out mesonet_temps.txt; then
              rm -rf publish && mkdir publish && cp mesonet_temps.txt publish/ && cd publish
              git init -q -b placefile
              git add mesonet_temps.txt
              git commit -q -m "Update placefile $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" placefile \
                || echo "publish failed; will retry next cycle"
              cd ..
            else
              echo "build failed; keeping last good placefile"
            fi
            took=$(( $(date +%s) - start ))
            [ "$took" -lt 300 ] && sleep $(( 300 - took ))
          done

      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/placefile.yml/enable" || true
